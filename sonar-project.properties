# Конфігурація для CLI sonar-scanner (альтернатива до `mvn sonar:sonar`).
# Перед запуском потрібно зібрати проєкт: mvn clean verify
sonar.projectKey=shop-quality
sonar.projectName=Shop Quality
sonar.host.url=http://localhost:9000
sonar.sourceEncoding=UTF-8

sonar.sources=src/main/java
sonar.tests=src/test/java
sonar.java.binaries=target/classes
sonar.java.test.binaries=target/test-classes
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
sonar.exclusions=**/ShopApplication.java

# Збірка "падає", якщо Quality Gate = FAILED
sonar.qualitygate.wait=true
